<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spice Landing Variations</title>
    <style>
      :root { --bg: #f6f1e7; --fg: #1d1915; --muted: #6b6258; --line: #ddd3c3; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14110e; --fg: #f1e9dc; --muted: #a39887; --line: #2e2822; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
      h1 { font-size: 2rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 32px; }
      a { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; font-size: 1.25rem; }
      a:hover { opacity: .7; }
      span { color: var(--muted); font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spice landing pages</h1>
      <p>Five directions for the pitch.</p>
      <nav id="list"></nav>
    </main>
    <script type="module">
      const pages = [
        ['v1', '01 · Masala Pop'], ['v2', '02 · The Kirana Counter'], ['v3', '03 · Midnight Masala'], ['v4', '04 · Darbar Maximalist'], ['v5', '05 · Spice Lab'],
      ]
      document.getElementById('list').innerHTML = pages.map(([p, t]) => `<a href="${import.meta.env.BASE_URL}${p}/">${t}<span>/${p}/ →</span></a>`).join('')
    </script>
  </body>
</html>
